data:
  raw_dir: data/raw
  processed_dir: data/processed
  # Use a supplied complete-year archive, not the plan's example 2016.
  year: 2025
  months: [1, 2, 3]

schema:
  # Discovered from the supplied 2025 ZIP and recorded in schema_report.md.
  alarm_table_prefix: tblAlarmLog
  alarm_code_col: Alarmcode
  alarm_time_col: TimeOn
  alarm_turbine_col: StationNr
  alarm_end_time_col: TimeOff
  # Stopping is supplied by the code-description lookup, not the alarm log.
  scada_time_col: TimeStamp
  scada_turbine_col: StationId
  scada_exclude_signals: [wtc_ActRegSt_endvalue]  # Categorical text, not numeric.
  # The output contract assumes UTC; the source's timezone is unverified.
  timestamp_timezone_assumption: UTC

detector:
  method: zscore
  window: 288
  threshold: 3.0

replay:
  speed: 600
  buffer_events: 2000

server:
  host: 127.0.0.1
  port: 8000

llm:
  base_url_env: LLM_BASE_URL
  api_key_env: LLM_API_KEY
  model_env: LLM_MODEL
